campaign_id: extension_dow_screening
mode: serial
description: |
  WoSAR 2026 extension: workload Design-of-Experiments screening, one strictly
  serial queue on the launch_cell production path. Resolution V 16+3CP per
  system x 3 systems = 57 runs (54 x 36h + 3 Dynamo center points x 48h).

# Own state file -- MUST NOT collide with the validation campaign.yaml state.
state_file: state/dow_campaign_state.json

replicas_per_cell: 1
# With replicas_per_cell: 1, cell_at_a_time and round_robin are equivalent and
# both preserve the cells: list order. The interleaving is baked into the list.
order: cell_at_a_time

inter_run_cooldown_s: 600
min_free_gb: 50
min_free_gb_mid_run: 25
retry_policy:
  max_retries: 1

runs_root: /home/dcotrone/wosar/runs
paths:
  hf_cache_host: /home/dcotrone/wosar/hf_cache
  repo_root: /home/dcotrone/wosar/llm-serving-bench

