# + 2026-07-10 amendment) for the rationale and windows.
#
# Fixed schedule seed: 20260710. The cells: list below IS the execution order
# (replicas_per_cell: 1, so campaign.py runs the list in order). The order
# interleaves the 3 systems round-robin (never >2 consecutive same-system),
# randomizes design points within each system by the seed, and places each
# system's 3 center points early/middle/late as drift sentinels.
