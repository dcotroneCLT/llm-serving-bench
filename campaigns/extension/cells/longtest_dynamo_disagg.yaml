# LONG TEST cell: NVIDIA Dynamo disaggregated, vLLM 0.20.1, 2 GPU.
#
# EXACT clone of cells/val_dynamo_disagg.yaml (the box-validated STEP-1 cell)
# with only three deltas for the 48h DoW-production dress rehearsal:
#   - duration_s      120000  -> 172800  (48h, the DoW production duration)
#   - warmup_discard_s   120  ->   3600  (1h warmup, the production discard)
#   - client rate: driven by a calibration file at fraction 0.30 of the measured
#     ceiling (the low DoW rate; conservative for an unattended 48h window).
#     target_rate_rps below is a placeholder -- launch_cell --calibration-file
#     overrides it with the calibration JSON's rate_calibrated_rps.
# Topology, monitors, per-component regexes, and every workload factor are
# IDENTICAL to the validated cell (do not diverge; the whole point is that this
# rehearses the exact validated path, only longer).

cell_id: longtest_dynamo_disagg
short_label: dynamo_disagg_016
description: |
  NVIDIA Dynamo 1.2.0 disaggregated (prefill + decode + frontend/KV-router),
  Qwen2.5-7B-Instruct, vLLM 0.20.1, 2 L40S. LONG TEST: the box-validated
  val_dynamo_disagg cell run for the full 48h production duration at the low
  (0.30 x ceiling) DoW rate, as the final gate before the ~57-run DoW campaign.

engine:
  image_repo: nvcr.io/nvidia/ai-dynamo/vllm-runtime
  image_tag: 1.2.0-cuda13
  digest_pin_file: engines/dynamo_vllm/image_pin.json
  # Lifecycle: launch_cell owns the full unattended bring-up/readiness/identity/
  # teardown of the multi-container stack via deploy/dynamo/*.sh (PHASE B item 2).
  # attach_run ignores lifecycle/topology and still drives a hand-started stack.
  lifecycle: dynamo_disagg
  topology:
    n_prefill: 1
    n_decode: 1
    prefill_gpu: 0
    decode_gpu: 1
  # gpu_devices is derived from the topology by DynamoDisaggLifecycle; kept here
  # for the attach path / documentation (must equal [prefill_gpu, decode_gpu]).
  gpu_devices: [0, 1]
  readyz:
    # /health is the liveness check; launch_cell ALSO re-verifies /v1/models
    # lists the model. timeout_s is the bring-up budget for serve_disaggregated.sh
    # (cold model load + readiness settle + poll).
    url: "http://localhost:8400/health"
    timeout_s: 900
  pid_strategy:
    type: external   # not managed here; monitoring is by recorded component PGIDs

monitors:
  proc:
    label: dynamo_engine   # not used as the analysis prefix; agg_dynamo is (see proc_prefix)
    period_s: 5
  gpu:
    period_s: 1
  system:
    period_s: 5
  rotation_s: 60
  # Per-component spec for multiproc_monitor. FREEZE these regexes against the
  # real `ps -eo pid,cmd | grep dynamo` tree on first bring-up.
  components:
    engine_group: dynamo
    root_pid: null            # host-wide cmdline scan (components run in separate containers)
    components:
      - label: dynamo_frontend
        pattern: "dynamo\\.frontend"
        group: engine
        note: "ingress + in-process KV-router (router is NOT a separate PID)"
      - label: dynamo_prefill
        pattern: "dynamo\\.vllm"
        require: "--disaggregation-mode prefill"
        group: engine
        expected_count: 1
      - label: dynamo_decode
        pattern: "dynamo\\.vllm"
        require: "--disaggregation-mode decode"
        group: engine
        expected_count: 1
      - label: etcd
        pattern: "etcd --listen-client-urls"
        group: infra
      - label: nats
        pattern: "nats-server"
        group: infra

workload:
  client_config_overrides:
    protocol: vllm_openai          # Dynamo frontend is OpenAI-compatible
    base_url: "http://localhost:8400"
    model: Qwen/Qwen2.5-7B-Instruct
    target_rate_rps: 1.0           # placeholder; overridden by --calibration-file
    concurrency_cap: 64
    streaming_prob: 0.7
    request_timeout_s: 600
    prefix_repeat_fraction: 0.8
    shared_prefix_len: 512
    arrival_mode: bursty
    burst_factor: 4.0
    burst_on_seconds: 5.0
    seed_template: "{replica}"

duration_s: 172800        # 48h (DoW production duration); val cell used 1500
warmup_discard_s: 3600    # 1h production warmup; val cell used 120
post_run_cooldown_s: 120
